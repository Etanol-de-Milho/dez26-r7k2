<style>
:root{--verde:#429F44;--vesc:#004E20;--lar:#FAA61A;--lar2:#C26A0A;--marrom:#351911;--cinza:#5b5b5b;--claro:#F2F5F0;--linha:#dfe5dc;--txt:#1b1b1b;--fundo:#fafbf9}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--txt);background:var(--fundo);font-size:15px;line-height:1.45}
a{color:var(--vesc)}
button{font:inherit}
.topo{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--verde);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.topo .l1{display:flex;align-items:center;gap:10px;padding:10px 14px 6px;max-width:1100px;margin:0 auto}
.topo h1{font-size:15px;margin:0;color:var(--vesc);line-height:1.2;flex:1}
.topo h1 small{display:block;font-weight:400;color:var(--cinza);font-size:12px}
.nav{display:flex;gap:6px}
.nav a{font-size:13px;text-decoration:none;padding:6px 10px;border-radius:16px;background:var(--claro);color:var(--vesc);font-weight:600;white-space:nowrap}
.nav a.on{background:var(--vesc);color:#fff}
.busca{max-width:1100px;margin:0 auto;padding:0 14px 8px;position:relative}
.busca input{width:100%;padding:9px 12px;border:1px solid #cfd6cc;border-radius:10px;font-size:16px;background:var(--fundo)}
.carimbo{max-width:1100px;margin:0 auto;padding:0 14px 8px;font-size:11.5px;color:var(--cinza)}
main{max-width:1100px;margin:0 auto;padding:12px 14px 60px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px;align-items:center}
.chips .g{font-size:12px;color:var(--cinza);margin-right:2px}
.chip{border:1px solid #cfd6cc;background:#fff;border-radius:16px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--txt)}
.chip.on{background:var(--vesc);border-color:var(--vesc);color:#fff}
.sep{width:1px;height:20px;background:#d6dcd3;margin:0 4px}
.prox{display:block;background:var(--vesc);color:#fff;text-decoration:none;border-radius:12px;padding:10px 14px;margin-bottom:12px}
.prox b{color:var(--lar)}
.dia{font-size:13px;font-weight:700;color:var(--vesc);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.03em}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.cards{grid-template-columns:1fr 1fr 1fr}}
.card{display:block;background:#fff;border:1px solid var(--linha);border-left:5px solid var(--verde);border-radius:10px;padding:10px 12px;text-decoration:none;color:inherit}
.card.proxima{border-left-color:var(--lar);box-shadow:0 0 0 2px var(--lar) inset}
.card .c1{display:flex;align-items:center;gap:8px}
.card img,.cab img{width:30px;height:auto;border:1px solid #e2e2e2;border-radius:2px}
.card .nome{font-weight:700;font-size:16px;flex:1}
.card .hora{font-size:13px;color:var(--cinza);white-space:nowrap}
.card .c2{display:flex;gap:6px;margin:8px 0 6px;flex-wrap:wrap}
.card .c3{font-size:13px;color:#333}
.card .c3 b{color:var(--vesc)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:14px;padding:3px 9px 3px 3px;font-size:12.5px;background:var(--claro);font-weight:600}
.pill i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-weight:800;font-size:13px}
.A{background:var(--verde)}.B{background:var(--lar);color:#1b1b1b!important}.C{background:var(--marrom)}
.tag{font-size:11.5px;border-radius:10px;padding:2px 8px;background:#fff3df;color:#7a4300;font-weight:600}
.alerta{color:#a35400;font-weight:700}
/* país */
.cab{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.cab img{width:44px}
.cab h2{margin:0;font-size:24px;color:var(--vesc);line-height:1.1}
.cab .sub{font-size:13.5px;color:var(--cinza)}
.passa{display:flex;justify-content:space-between;gap:8px;margin:8px 0 10px}
.passa a{font-size:13px;text-decoration:none;background:#fff;border:1px solid var(--linha);border-radius:16px;padding:5px 11px;color:var(--vesc);max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sema{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.sema .pill{font-size:13.5px;padding:4px 11px 4px 4px}
.sema .pill i{width:26px;height:26px;font-size:15px}
.notas{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:4px 14px;margin-bottom:14px}
.nota{padding:9px 0;border-bottom:1px solid #eef1ec}
.nota:last-child{border-bottom:0}
.nota .t{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--verde);margin-bottom:2px}
.nota.numeros .t{color:var(--lar2)}
h3.bl{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--vesc);margin:14px 0 6px;display:flex;align-items:center;gap:8px}
h3.bl:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--verde) 70%,var(--lar) 70%)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:640px){.tiles{grid-template-columns:1fr 1fr 1fr}}
.tile{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:9px 11px;min-height:92px}
.tile .r{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--cinza)}
.tile .v{font-size:22px;font-weight:800;color:var(--vesc);line-height:1.15;margin:3px 0 2px;word-break:break-word}
.tile .v.m{font-size:17px}
.tile .l{font-size:12.5px;color:#333;line-height:1.3}
.tile .l2{font-size:12px;color:var(--cinza);line-height:1.3;margin-top:2px}
.tile.precos{grid-column:span 2}
@media(min-width:640px){.tile.precos{grid-column:span 1}}
.tile.precos .lin{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;margin-top:4px}
.tile.precos .lin b.br{color:var(--verde)} .tile.precos .lin b.us{color:var(--marrom)}
.acesso{font-size:12.5px;color:var(--cinza);margin:6px 2px 0}
details{background:#fff;border:1px solid var(--linha);border-radius:10px;margin:8px 0}
summary{cursor:pointer;padding:11px 14px;font-weight:700;color:var(--vesc);list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸";color:var(--verde);font-size:14px;width:12px}
details[open]>summary:before{content:"▾"}
.dc{padding:0 14px 12px}
.dc h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--verde);margin:12px 0 4px}
ol.q{padding-left:20px;margin:4px 0}
ol.q li{margin:6px 0}
ol.q .lig{font-size:12px;color:var(--cinza)}
ul.p{padding-left:18px;margin:4px 0}ul.p li{margin:4px 0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--claro);border-left:4px solid var(--verde);border-radius:6px;padding:7px 9px}
.kpi .r{font-size:10.5px;font-weight:700;color:var(--cinza);text-transform:uppercase}
.kpi .v{font-size:19px;font-weight:800;color:var(--vesc)}
.kpi .v small{font-size:12px}
.kpi .ls{font-size:12px;line-height:1.3}
.fonte{font-size:11px;color:#777;margin:2px 0 6px}
.fonte a{color:#777}
.tx p{margin:3px 0}
.tx.peq{font-size:12px;color:var(--cinza)}
.tx.gr p{font-size:20px;font-weight:800}
.c-verde{color:var(--verde)}.c-vesc{color:var(--vesc)}.c-marrom{color:var(--marrom)}.c-lar2,.c-laranja{color:var(--lar2)}.c-cinza{color:var(--cinza)}

table{border-collapse:collapse;font-size:12.5px;min-width:100%}
th{background:var(--vesc);color:#fff;text-align:left;padding:5px 7px;font-weight:700}
td{padding:5px 7px;border-bottom:1px solid #e8ece6;vertical-align:top}
tr:nth-child(even) td{background:var(--claro)}
td:first-child{font-weight:700}
.g100{margin:8px 0}
.g100 .row{display:flex;align-items:center;gap:6px;margin:4px 0}
.g100 .ano{width:42px;font-size:12px;font-weight:700}
.g100 .bar{flex:1;display:flex;height:24px;gap:2px}
.g100 .seg{display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;border-radius:3px;min-width:0;overflow:hidden}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin-top:4px}

.cols .cb{width:100%;border-radius:4px 4px 0 0;min-height:1px}
.cols .lb{font-size:11px;font-weight:700;margin-bottom:2px}
.cols .ct{font-size:10.5px;color:var(--cinza);text-align:center;margin-top:3px;line-height:1.1;height:24px}
.dots .row{display:flex;align-items:center;gap:8px;margin:12px 0}
.dots .ano{width:64px;font-size:12px;font-weight:700}
.dots .trk{flex:1;position:relative;height:30px}
.dots .ln{position:absolute;top:8px;height:3px;background:#bbb}
.dots .pt{position:absolute;top:3px;width:13px;height:13px;border-radius:50%;margin-left:-6px}
.dots .vl{position:absolute;top:17px;font-size:11px;font-weight:700;transform:translateX(-50%);white-space:nowrap}
.dots .df{width:96px;font-size:11.5px;line-height:1.2}
.res{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:9px 12px;margin:8px 0;display:block;text-decoration:none;color:inherit}
.res .n{font-weight:700;color:var(--vesc)}
.res .s{font-size:12.5px;color:#444}
mark{background:#ffe29a;padding:0 1px;border-radius:2px}
.vazio{color:var(--cinza);font-size:14px;padding:20px 0}
.rod{font-size:11.5px;color:var(--cinza);margin-top:24px;border-top:1px solid var(--linha);padding-top:8px}
.crit{display:grid;grid-template-columns:auto auto;gap:3px 12px;font-size:13px;margin:6px 0}
.crit .d{display:inline-flex;gap:3px}.crit .d i{width:16px;height:8px;border-radius:2px;background:#ddd;display:inline-block}
.crit .d i.A{background:var(--verde)}.crit .d i.B{background:var(--lar)}.crit .d i.C{background:var(--marrom)}
.semb{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:640px){.semb{grid-template-columns:1fr 1fr}}
.semb .bx{background:var(--claro);border-radius:8px;padding:9px 11px}
table.cmp{background:#fff;font-size:12.5px}
table.cmp td{vertical-align:top;min-width:84px}
table.cmp td:first-child{min-width:110px}
table.cmp th{white-space:nowrap;position:sticky;top:0}
table.cmp.lado td:first-child{font-size:11.5px;color:var(--cinza);text-transform:uppercase;min-width:90px}
table.cmp.lado th[colspan]{background:var(--claro);color:var(--vesc);text-transform:uppercase;font-size:11.5px}

table.t-sem td{min-width:0;padding:5px 4px}table.t-sem td:first-child{min-width:104px}table.t-sem th{padding:5px 4px;font-size:11.5px}
table.t-conc td:nth-child(6){min-width:150px}
.nav{flex-wrap:nowrap}
</style>
</head>

ale mais quando entra em um programa de combustível","(a) RFS, o mandato federal da EPA","(b) LCFS, o programa da Califórnia: paga mais a quem tem menor emissão de carbono","(c) 45Z, crédito fiscal federal desde 2025: desde 2026 só vale para combustível de matéria-prima da América do Norte","o etanol brasileiro segue chegando, mas não aparece como combustível nos programas","desde 2023"]},{"tipo":"numeros","texto":"O uso atual do etanol brasileiro nos EUA (industrial, bebidas, reexportação ou outro) não está confirmado: é pergunta à adidância, não afirmação.","originais":["o uso do etanol brasileiro nos EUA é pergunta, não afirmação","(industrial, bebidas, reexportação ou outro)"]}],"secoes":[{"titulo":"1. Retrato","itens":[{"t":"kpi","rotulo":"População 2025","valor":"341,8","unidade":"mi hab.","linhas":[[{"x":"+0,8% a.a. (tend. 2021–25)","b":false,"c":""}],[{"x":"Brasil: 212,8 mi","b":false,"c":""}]],"fonte":"Banco Mundial","link":"https://data.worldbank.org/"},{"t":"kpi","rotulo":"PIB per capita 2025","valor":"US$ 90,0","unidade":"mil","linhas":[[{"x":"PIB: US$ 30,77 tri","b":false,"c":""}],[{"x":"Brasil: US$ 10,7 mil per capita","b":false,"c":""}]],"fonte":"Banco Mundial","link":"https://data.worldbank.org/"},{"t":"kpi","rotulo":"Gasolina 2025","valor":"518,5","unidade":"bi L","linhas":[[{"x":"−0,6% sobre 2024","b":false,"c":""}],[{"x":"Brasil (gasolina C): 46,7 bi L","b":false,"c":""}]],"fonte":"EIA","link":"https://www.eia.gov/petroleum/"},{"t":"kpi","rotulo":"Bovinos 2024","valor":"87,2","unidade":"mi cab.","linhas":[[{"x":"suínos 75 mi · frangos 1,55 bi","b":false,"c":""}],[{"x":"maiores rebanhos","b":false,"c":""}]],"fonte":"FAOSTAT","link":"https://www.fao.org/faostat/en/#data/QCL"}]},{"titulo":"2. Etanol: o maior produtor do mundo","itens":[{"t":"txt","paras":[[{"x":"MISTURA EFETIVA 2025","b":true,"c":"branco"}]],"pequeno":false,"cinza":false,"grande":false},{"t":"txt","paras":[[{"x":"E10","b":true,"c":"branco"}]],"pequeno":false,"cinza":false,"grande":tr const ptxt = ps => ps.map(p => p.map(r => r.x).join("")).join(" ");
const flag = iso => FL[P[iso]?.flag] ? `<img src="${FL[P[iso].flag]}" alt="">` : "";
const pill = (rot, s) => s ? `<span class="pill"><i class="${s.classe}">${s.classe}</i>${rot} · ${esc(s.pontos)}</span>` : "";
function inicio(p) { const [d, m] = p.dia.slice(0, 5).split("/").map(Number); const [h, mi] = p.hora.split(":").map(Number); return new Date(2026, m - 1, d, h, mi); }
function proxima() { const ag = Date.now(); return D.paises.map(p => p.iso).sort((a, b) => inicio(P[a]) - inicio(P[b])).find(i => inicio(P[i]).getTime() + 25 * 60000 > ag); }

// ---------------- panorama
function panorama() {
  const px = proxima();
  const chip = (k, v, rot) => `<button class="chip ${F[k] === v ? "on" : ""}" data-f="${k}" data-v="${v}">${rot}</button>`;
  let h = `<div class="chips"><span class="g">Dia</span>${chip("dia", "", "Todos")}${chip("dia", "02/12", "02/12 (qua)")}${chip("dia", "03/12", "03/12 (qui)")}</div>
  <div class="chips"><span class="g">DDG/DDGS</span>${["A","B","C"].map(c => chip("ddg", c, c)).join("")}<span class="sep"></span><span class="g">Etanol</span>${["A","B","C"].map(c => chip("etanol", c, c)).join("")}
  <span class="sep"></span><button class="chip ${F.alerta ? "on" : ""}" data-f="alerta" data-v="1">⚠ com alerta</button></div>`;
  if (px) h += `<a class="prox" href="#/p/${px}">Próxima reunião: <b>${esc(P[px].pais)}</b> · ${esc(P[px].dia)} ${esc(P[px].hora)} →</a>`;
  const vis = D.agenda.filter(a => {
    const p = P[a.iso]; if (!p) return !F.ddg && !F.etanol && !F.alerta && (!F.dia || a.dia.startsWith(F.dia));
    if (F.dia && !p.dia.startsWith(F.dia)) return false;
    if (F.ddg && p.semaforo?.ddg?.classe !== F.ddg) return false;
    if (F.etanol && p.semaforo?.etanol?.classe !== F.etanol) return false;
    if (F.alerta && !p.alerta) return false;
    return true;
  });
  let dia = "";
  vis.forEach(a => {
    if (a.dia !== dia) { if (dia) h += "</div>"; dia = a.dia; h += `<div class="dia">${esc(a.dia)}</div><div class="cards">`; }
    const p = P[a.iso];
    if (!p) { h += `<div class="card" style="opacity:.55"><div class="c1"><span class="nome">${esc(a.pais)}</span><span class="hora">${esc(a.hora)}</span></div><div class="c3">em preparação</div></div>`; return; }
    const g = p.grandes;
    if (!p.semaforo) {   // EUA e FAO: formato próprio, sem semáforo
      h += `<a class="card ${a.iso === px ? "proxima" : ""}" href="#/p/${a.iso}" style="border-left-color:var(--vesc)"><div class="c1">${flag(a.iso)}<span class="nome">${esc(p.pais)}</span><span class="hora">${esc(p.hora)}</span></div>
        <div class="c2"><span class="tag" style="background:var(--claro);color:var(--vesc)">formato próprio · sem semáforo</span>${a.iso === px ? '<span class="tag">próxima</span>' : ""}</div>
        <div class="c3">${g.geral.slice(0, 2).map(t => `${esc(t.rot)}: <b>${esc(t.resp || t.valor)}</b>`).join(" · ")}</div></a>`;
      return;
    }
    const imp = g.ddg[0], br = g.ddg[1], us = g.ddg[2];
    h += `<a class="card ${a.iso === px ? "proxima" : ""}" href="#/p/${a.iso}"><div class="c1">${flag(a.iso)}<span class="nome">${esc(p.pais)}</span><span class="hora">${esc(p.hora)}</span></div>
      <div class="c2">${pill("DDG/DDGS", p.semaforo.ddg)}${pill("Etanol", p.semaforo.etanol)}${p.alerta ? '<span class="tag">⚠ alerta</span>' : ""}${a.iso === px ? '<span class="tag">próxima</span>' : ""}</div>
      <div class="c3">Importa DDG/DDGS: <b>${esc(imp.valor || imp.resp)}</b> · Brasil <b>${esc(br.resp || "—")}</b> · EUA <b>${esc(us.resp || "—")}</b></div></a>`;
  });
  if (dia) h += "</div>"; else h += `<div class="vazio">Nenhum país com esses filtros.</div>`;
  h += `<div class="rod">Semáforo: A = 6–8 pontos · B = 3–5 · C = 0–2 (quatro critérios de 0 a 2: tamanho, crescimento, acesso, presença do Brasil). Uso interno da UNEM.</div>`;
  return h;
}

// ---------------- blocos da ficha (renderização genérica do que o gerador desenhou)
function graf(g) {
  if (g.tipo === "barras100") {
    const nomes = g.series.map(s => s.nome);
    const cor = n => COR[n] || COR3;
    let h = `<div class="g100">`;
    g.cats.forEach((c, i) => {
      h += `<div class="row"><span class="ano">${esc(c)}</span><div class="bar">` + g.series.map(s => {
        const v = s.vals[i] || 0; if (v <= 0) return "";
        return `<div class="seg" title="${esc(s.nome)} ${esc(s.rotulos[i])}" style="flex:${v};background:${cor(s.nome)};${s.nome === "Outros" || cor(s.nome) === COR3 ? "color:#1b1b1b" : ""}">${esc(s.rotulos[i])}</div>`;
      }).join("") + `</div></div>`;
    });
    return h + `<div class="leg">${nomes.map(n => `<span style="--k:${cor(n)}">${esc(n)}</span>`).join("")}</div></div>`;
  }
  const st = g.tipo === "empilhado";
  const tot = g.cats.map((_, i) => st ? g.series.reduce((a, s) => a + (s.vals[i] || 0), 0) : Math.max(...g.series.map(s => s.vals[i] || 0)));
  const mx = Math.max(...tot, 1e-9);
  const corc = (s, i, n) => st ? (COR[s.nome] || "#C8C8C8") : (i >= n - 2 && /jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov/.test(g.cats[i]) ? (i === n - 1 ? "#FAA61A" : "#F1D295") : "#429F44");
  let h = `<div class="cols">` + g.cats.map((c, i) => {
    const lb = st ? "" : g.series.map(s => s.rotulos[i]).filter(Boolean).join(" ");
    const bars = g.series.map(s => { const v = s.vals[i] || 0; if (v <= 0) return ""; return `<div class="cb" title="${esc(s.nome)}: ${esc(s.rotulos[i] || "")}" style="height:${(v / mx * 110).toFixed(1)}px;background:${corc(s, i, g.cats.length)}"></div>`; }).join("");
    const lbs = st ? g.series.map(s => s.rotulos[i]).filter(Boolean).join(" · ") : lb;
    return `<div class="cc"><span class="lb">${esc(lbs)}</span><div class="st">${bars}</div><span class="ct">${esc(c)}</span></div>`;
  }).join("") + `</div>`;
  if (st) h += `<div class="leg">${g.series.map(s => `<span style="--k:${COR[s.nome] || "#C8C8C8"}">${esc(s.nome)}</span>`).join("")}</div>`;
  return h;
}
function dots(linhas) {
  const vs = linhas.flatMap(l => [l.vb, l.ve]).filter(v => v);
  if (!vs.length) return "";
  const lo = Math.min(...vs) - 25, hi = Math.max(...vs) + 25, pos = v => ((v - lo) / (hi - lo) * 100).toFixed(1);
  return `<div class="leg" style="margin:4px 0 0"><span style="--k:#429F44">Brasil</span><span style="--k:#351911">EUA</span></div><div class="dots">` + linhas.map(l => {
    let t = `<div class="row"><span class="ano">${esc(l.rot)}</span><div class="trk">`;
    if (l.vb && l.ve) t += `<div class="ln" style="left:${Math.min(pos(l.vb), pos(l.ve))}%;width:${Math.abs(pos(l.vb) - pos(l.ve))}%"></div>`;
    if (l.vb) t += `<div class="pt" style="left:${pos(l.vb)}%;background:#429F44"></div><div class="vl c-verde" style="left:${pos(l.vb)}%">${esc(l.brasil)}</div>`;
    if (l.ve) t += `<div class="pt" style="left:${pos(l.ve)}%;background:#351911"></div><div class="vl c-marrom" style="left:${pos(l.ve)}%">${esc(l.eua)}</div>`;
    return t + `</div><span class="df">${l.dif ? "Brasil <b class='" + (l.barato ? "c-vesc" : "c-lar2") + "'>" + esc(l.dif) + "</b>" : ""}</span></div>`;
  }).join("") + `</div>`;
}
function item(it) {
  switch (it.t) {
    case "kpi": return `<div class="kpi"><div class="r">${esc(it.rotulo)}</div><div class="v">${esc(it.valor)} <small>${esc(it.unidade)}</small></div><div class="ls">${runs(it.linhas)}</div>${it.fonte ? `<div class="fonte">Fonte: ${it.link ? `<a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.fonte)} ↗</a>` : esc(it.fonte)}</div>` : ""}</div>`;
    case "txt": return `<div class="tx ${it.pequeno || it.cinza ? "peq" : ""} ${it.grande ? "gr" : ""}">${runs(it.paras)}</div>`;
    case "fonte": return `<div class="fonte">Fonte: ${it.link ? `<a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.txt)} ↗</a>` : esc(it.txt)}</div>`;
    case "tab": return `<div class="tabw"><table>${it.linhas.map((l, i) => "<tr>" + l.map(c => i ? `<td>${esc(c)}</td>` : `<th>${esc(c)}</th>`).join("") + "</tr>").join("")}</table></div>`;
    case "graf": return graf(it);
    case "precos": return dots(it.linhas);
    case "rodape": return `<div class="tx peq">${runs(it.paras)}</div>`;
  }
  return "";
}
function secao(p, s) {
  let h = "", kp = [];
  const flush = () => { if (kp.length) { h += `<div class="kpis">${kp.join("")}</div>`; kp = []; } };
  if (/^7\. Sem/i.test(s.titulo) && p.semaforo) {   // semáforo: desenhado a partir dos pontos
    const nm = {tamanho: "Tamanho", crescimento: "Crescimento", acesso: "Acesso", presenca_brasil: "Presença do Brasil"};
    h += `<div class="semb">` + [["ddg", "DDG/DDGS"], ["etanol", "Etanol"]].map(([k, r]) => { const se = p.semaforo[k];
      return `<div class="bx">${pill(r, se)}<div class="crit">${Object.entries(se.criterios).map(([c, v]) => `<span>${nm[c]}</span><span class="d">${[0, 1].map(b => `<i class="${b < v ? se.classe : ""}"></i>`).join("")}</span>`).join("")}</div><div class="tx peq"><p>Acesso: ${esc(se.acesso)}</p></div></div>`; }).join("") + `</div>`;
    const ult = s.itens.filter(i => i.t === "txt").slice(-1)[0]; if (ult) h += item(ult);
    return h;
  }
  s.itens.forEach(it => { if (it.t === "kpi") kp.push(item(it)); else { flush(); h += item(it); } });
  flush();
  return h;
}

// ---------------- página do país
function tile(t, k) {
  if (t.precos) return `<div class="tile precos"><div class="r">Preço de embarque (US$/t)</div>${t.precos.map(l => `<div class="lin"><span>${esc(l.rot)}</span><span><b class="br">${esc(l.brasil || "—")}</b> × <b class="us">${esc(l.eua || "—")}</b></span></div>${l.dif ? `<div class="l2">Brasil ${esc(l.dif)}</div>` : ""}`).join("")}${t.sub ? `<div class="l2">${esc(t.sub)}</div>` : ""}</div>`;
  const v = t.resp || t.valor || "—";
  const longo = String(v).length > 12;
  return `<div class="tile"><div class="r">${esc(t.rot)}${t.alerta ? ' <span class="alerta">⚠</span>' : ""}</div><div class="v ${longo ? "m" : ""}">${esc(v)}</div>${t.resp && t.valor ? `<div class="l">${esc(t.valor)}</div>` : ""}${t.outro ? `<div class="l">${esc(t.outro)}</div>` : ""}${t.sub ? `<div class="l2">${esc(t.sub)}</div>` : ""}</div>`;
}
function paginaPais(iso, termo) {
  const p = P[iso]; if (!p) return `<div class="vazio">País não encontrado.</div>`;
  const i = ORDEM.indexOf(iso), ant = ORDEM[i - 1], prox = ORDEM[i + 1];

  let h = `<div class="passa">${ant ? `<a href="#/p/${ant}">‹ ${esc(P[ant].pais)}</a>` : "<span></span>"}${prox ? `<a href="#/p/${prox}">${esc(P[prox].pais)} ›</a>` : "<span></span>"}</div>
  <div class="cab">${flag(iso)}<div><h2>${esc(p.pais)}</h2><div class="sub">${esc(p.agenda)}</div></div></div>
  <div class="sema">${p.semaforo ? pill("DDG/DDGS", p.semaforo.ddg) + pill("Etanol", p.semaforo.etanol) : `<span class="tag" style="background:var(--claro);color:var(--vesc)">formato próprio · sem semáforo</span>`}</div>`;
  if (p.notas.length) h += `<div class="notas">${p.notas.map(n => `<div class="nota ${n.tipo}"><div class="t">${TIPO[n.tipo]}</div>${esc(n.texto)}</div>`).join("")}</div>`;
  if (g.geral) {
    h += `<h3 class="bl">Números principais</h3><div class="tiles">${g.geral.map(tile).join("")}</div>`;
  } else {
    h += `<h3 class="bl">DDG/DDGS</h3><div class="tiles">${g.ddg.map(tile).join("")}</div><div class="acesso">${esc(g.acesso_ddg)}</div>`;
    if (p.alerta) h += `<div class="acesso alerta">⚠ Atenção: ${esc(p.alerta)}</div>`;
    h += `<h3 class="bl">Etanol</h3><div class="tiles">${g.etanol.map(tile).join("")}</div><div class="acesso">${esc(g.acesso_etanol)}</div>`;
  }
  h += `<h3 class="bl">Para a conversa</h3>`;
  h += `<details ${termo ? "" : "open"}><summary>O que já pedimos e o que vamos pedir</summary><div class="dc">
    <h4>Já pedido no formulário (enviado antes da reunião)</h4>${p.ja_pedido.length ? `<ul class="p">${p.ja_pedido.map(j => `<li>${esc(j)}</li>`).join("")}</ul>` : `<p>Nada registrado no formulário.</p>`}
    <h4>Pedidos no documento entregue ao adido (na reunião)</h4><ol class="q">${p.pedidos_adido.map(q => `<li><b>${esc(q.tema)}:</b> ${esc(q.texto)}</li>`).join("")}</ol>
    <h4>Perguntas novas da ficha interna</h4><ol class="q">${p.perguntas.map(q => `<li><b>${esc(q.tema)}:</b> ${esc(q.texto)}${q.liga_a ? `<div class="lig">Liga a: ${esc(q.liga_a)}</div>` : ""}</li>`).join("")}</ol>
    ${p.agroinsight ? `<h4>Agro Insight do MAPA</h4><p>${esc(p.agroinsight)}</p>` : ""}</div></details>`;
  h += `<h3 class="bl">Detalhes da ficha interna</h3>`;
  p.secoes.forEach(s => { h += `<details><summary>${esc(s.titulo)}</summary><div class="dc">${secao(p, s)}</div></details>`; });
  h += `<div class="rod">${esc(D.carimbo)}. Uso interno da UNEM.</div>`;
  return h;
}

// ---------------- comparações (só números e textos das fichas; os números brutos servem só para ordenar e para a escala)
const ABAS = [["paises", "Comparar países"], ["concorrentes", "Brasil × concorrentes"], ["etanol", "Etanol: mandatos e tarifas"], ["disputa", "Mercado em disputa"], ["semaforo", "Semáforo aberto"]];
const SEL = [];
const ORD = {col: null, asc: false};
const PAD = () => D.agenda.map(a => P[a.iso]).filter(p => p && p.semaforo);
function vol(s) {   // "1,37 mi t" → 1370000 (só para ordenar)
  const m = String(s || "").match(/([\d.]+(?:,\d+)?)\s*(mi|mil|bi)?/); if (!m) return -1;
  const v = parseFloat(m[1].replace(/\./g, "").replace(",", ".")); return v * ({mi: 1e6, mil: 1e3, bi: 1e9}[m[2]] || 1);
}
const pct = s => { const m = String(s || "").match(/([\d,]+)%/); return m ? parseFloat(m[1].replace(",", ".")) : -1; };
function tabelaOrd(cols, linhas, id) {
  // cols: [rótulo, função de ordenação|null]; linhas: [{cel:[html...], chave:[valores]}]
  if (ORD.tab === id && ORD.col !== null) linhas = linhas.slice().sort((a, b) => (ORD.asc ? 1 : -1) * ((a.chave[ORD.col] > b.chave[ORD.col]) - (a.chave[ORD.col] < b.chave[ORD.col])));
  return `<div class="tabw"><table class="cmp t-${id}"><tr>${cols.map((c, i) => `<th ${c[1] ? `data-ord="${i}" data-tab="${id}" style="cursor:pointer"` : ""}>${esc(c[0])}${ORD.tab === id && ORD.col === i ? (ORD.asc ? " ▲" : " ▼") : (c[1] ? " ↕" : "")}</th>`).join("")}</tr>` +
    linhas.map(l => `<tr>${l.cel.map(c => `<td>${c}</td>`).join("")}</tr>`).join("") + `</table></div>`;
}
const lp = p => `<a href="#/p/${p.iso}" style="text-decoration:none;color:inherit;white-space:nowrap">${flag(p.iso).replace('<img', '<img style="width:20px;vertical-align:-2px;margin-right:4px"')}${esc(p.pais)}</a>`;
const cls = s => s ? `<span class="pill" style="padding:2px 6px 2px 2px"><i class="${s.classe}" style="width:18px;height:18px;font-size:11px">${s.classe}</i>${esc(String(s.total))}</span>` : "";
function comparar(aba) {
  aba = aba || "paises";
  let h = `<div class="chips">${ABAS.map(([k, r]) => `<a class="chip ${k === aba ? "on" : ""}" href="#/comparar/${k}" style="text-decoration:none">${r}</a>`).join("")}</div>`;
  const L = PAD();
  if (aba === "paises") {
    h += `<p class="tx peq" style="margin:0 0 6px">Toque em até 4 países para ver os mesmos quadros lado a lado.</p><div class="chips">` +
      D.agenda.map(a => P[a.iso]).filter(Boolean).map(p => `<button class="chip ${SEL.includes(p.iso) ? "on" : ""}" data-sel="${p.iso}">${esc(p.pais)}</button>`).join("") + `</div>`;
    const ps = SEL.map(i => P[i]);
    if (!ps.length) return h + `<div class="vazio">Nenhum país escolhido.</div>`;
    const lin = [];

      : `<b>${esc(t.resp || t.valor || "—")}</b>${t.resp && t.valor ? `<div class="tx peq">${esc(t.valor)}</div>` : ""}${t.outro ? `<div class="tx peq">${esc(t.outro)}</div>` : ""}`) : "";
    add("Data", p => esc(p.dia + " " + p.hora));
    add("Semáforo DDG/DDGS", p => p.semaforo ? pill("", p.semaforo.ddg).replace(" · ", "") : "formato próprio");
    add("Semáforo etanol", p => p.semaforo ? pill("", p.semaforo.etanol).replace(" · ", "") : "formato próprio");
    if (ps.some(p => p.grandes.ddg)) {
      lin.push(`<tr><th colspan="${ps.length + 1}">DDG/DDGS</th></tr>`);

      add("Acesso", p => p.grandes.acesso_ddg ? `<span class="tx peq">${esc(p.grandes.acesso_ddg.replace("Acesso: ", ""))}</span>` : "");
      lin.push(`<tr><th colspan="${ps.length + 1}">Etanol</th></tr>`);
      ps.find(p => p.grandes.etanol).grandes.etanol.forEach((_, i) => add(esc(["Mandato", "O mandato aceita etanol importado?", "Tarifa", "Importa etanol (2025)", "Etanol do Brasil"][i] || ""), p => p.grandes.etanol ? ([0, 2].includes(i) ? `<span class="tx peq">${esc(p.grandes.etanol[i].rot)}</span><br>` : "") + tl(p.grandes.etanol[i]) : ""));
      add("Acesso", p => p.grandes.acesso_etanol ? `<span class="tx peq">${esc(p.grandes.acesso_etanol.replace("Acesso: ", ""))}</span>` : "");
    }

    const ln = L.map(p => { const g = p.grandes.ddg, pr = g[4].precos ? g[4].precos[0] : null;
      return {chave: [p.pais, vol(g[0].valor), pct(g[1].resp), pct(g[2].resp), "", pr ? (pr.ve || 0) - (pr.vb || 0) : -1e9, ""],
        cel: [lp(p), `<b>${esc(g[0].valor || g[0].resp)}</b>`, pct(g[1].resp) >= 0 ? `<b class="c-verde">${esc(g[1].resp)}</b>` : `<b class="c-verde">—</b><div class="tx peq">${esc((g[1].rot === "Brasil (vende hoje)" ? "vende hoje" : g[1].rot) + ": " + (g[1].resp || "—"))}</div>`,
          `<b class="c-marrom">${esc(g[2].resp || "—")}</b>`, esc(g[2].outro || ""),
          pr ? `<b class="c-verde">${esc(pr.brasil || "—")}</b> × <b class="c-marrom">${esc(pr.eua || "—")}</b>${pr.dif ? `<div class="tx peq">Brasil ${esc(pr.dif)}</div>` : ""}${g[4].sub ? `<div class="tx peq">${esc(g[4].sub)}</div>` : ""}` : `<span class="tx peq">${esc(g[4].sub || "—")}</span>`,
          `<b>${esc(g[3].resp || "—")}</b>${g[3].alerta ? ' <span class="alerta">⚠</span>' : ""}${g[3].valor ? `<div class="tx peq">${esc(g[3].valor.replace("concorrente: ", ""))}</div>` : ""}`]}; });
    return h + `<p class="tx peq" style="margin:0 0 6px">Fatias de 2025 no que o país importa (gráfico do bloco 3 da ficha; fatias abaixo de 3% não são escritas na ficha: "—"). Toque no título da coluna para ordenar; a coluna de preço ordena pela vantagem do Brasil.</p>` + tabelaOrd(cols, ln, "conc");
  }
  if (aba === "etanol") {
    const cols = [["País", 1], ["Mandato", null], ["O mandato aceita etanol importado?", 1], ["Tarifa", 1], ["Importa (2025)", 1], ["Brasil", null], ["Semáforo", 1]];
    const ln = L.map(p => { const e = p.grandes.etanol;
      return {chave: [p.pais, "", e[1].resp, pct(e[2].resp), p.comp.etanol_m3, "", p.semaforo.etanol.total],
        cel: [lp(p), `<b>${esc(e[0].resp)}</b><div class="tx peq">${esc([e[0].valor, e[0].sub].filter(Boolean).join(" · "))}</div>`, `<b>${esc(e[1].resp || "—")}</b>${e[1].resp ? "" : `<div class="tx peq">${esc(e[1].sub || e[0].sub || "")}</div>`}`,
          `<b>${esc(e[2].resp || "—")}</b><div class="tx peq">${esc(e[2].rot.replace("Tarifa ", ""))}${e[2].valor ? " · " + esc(e[2].valor.replace("concorrente: ", "")) : ""}</div>`,
          `<b>${esc(e[3].resp || "—")}</b>`, `${esc(e[4].resp || "")}<div class="tx peq">${esc(e[4].valor || "")}</div>`, cls(p.semaforo.etanol)]}; });
    return h + `<p class="tx peq" style="margin:0 0 6px">Do bloco 2 e da tabela de barreiras de cada ficha. Toque no título da coluna para ordenar.</p>` + tabelaOrd(cols, ln, "et");
  }
  if (aba === "disputa") {
    const com = L.filter(p => p.comp.disputa).sort((a, b) => b.comp.disputa_t - a.comp.disputa_t);
    const mx = Math.max(...com.map(p => Math.max(p.comp.disputa_t, p.comp.brasil_t || 0)));
    h += `<p class="tx peq" style="margin:0 0 6px">Mercado em disputa = o que o país já compra de DDG/DDGS dos EUA (USDA GATS), ao lado do que o Brasil vende hoje (Secex). Mesma escala para todos.</p>
      <div class="leg" style="margin-bottom:8px"><span style="--k:#351911">Compra dos EUA (em disputa)</span><span style="--k:#429F44">Brasil vende hoje</span></div>`;
    h += com.map(p => `<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:13px">${lp(p)}<span class="tx peq">teto ${esc(p.comp.teto || "—")}</span></div>
      <div style="display:flex;align-items:center;gap:6px"><div style="height:12px;border-radius:0 4px 4px 0;background:#351911;width:${(p.comp.disputa_t / mx * 72).toFixed(1)}%"></div><b style="font-size:12.5px">${esc(p.comp.disputa)}</b></div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:2px"><div style="height:12px;border-radius:0 4px 4px 0;background:#429F44;width:${((p.comp.brasil_t || 0) / mx * 72).toFixed(1)}%;min-width:${p.comp.brasil_t ? 2 : 0}px"></div><b class="c-verde" style="font-size:12.5px">${esc(p.comp.brasil_hoje)}</b></div></div>`).join("");
    const fora = L.filter(p => !p.comp.disputa);
    if (fora.length) h += `<div class="rod">Com outro quadro no bloco 5 da ficha (mercado pequeno, recém-aberto ou com outro fornecedor principal): ${fora.map(p => `<a href="#/p/${p.iso}">${esc(p.pais)}</a>${p.comp.outro_formato ? " (" + esc(p.comp.outro_formato.toLowerCase()) + ")" : ""}`).join(" · ")}. EUA e FAO têm formato próprio.</div>`;
    return h;
  }
  if (aba === "semaforo") {
    const nm = [["tamanho", "Tam."], ["crescimento", "Cresc."], ["acesso", "Acesso"], ["presenca_brasil", "Presença"]];
    const pts = (s, c) => `<span class="crit"><span class="d">${[0, 1].map(b => `<i class="${b < s.criterios[c] ? s.classe : ""}"></i>`).join("")}</span></span>`;
    const cols = [["País", 1], ["DDG/DDGS", 1], ...nm.map(([, r]) => [r, null]), ["Etanol", 1], ...nm.map(([, r]) => [r, null])];
    const ln = L.map(p => ({chave: [p.pais, p.semaforo.ddg.total, 0, 0, 0, 0, p.semaforo.etanol.total],
      cel: [lp(p), cls(p.semaforo.ddg), ...nm.map(([c]) => pts(p.semaforo.ddg, c)), cls(p.semaforo.etanol), ...nm.map(([c]) => pts(p.semaforo.etanol, c))]}));
    return h + `<p class="tx peq" style="margin:0 0 6px">Quatro critérios de 0 a 2 pontos (cada traço = 1 ponto): tamanho, crescimento, acesso e presença do Brasil. A = 6–8 · B = 3–5 · C = 0–2. EUA e FAO não têm semáforo.</p>` + tabelaOrd(cols, ln, "sem");
  }
  return h;
}

// ---------------- busca
function textoPais(p) {
  const t = [p.pais, SINON[p.iso] || "", p.agenda, ...p.notas.map(n => n.texto), ...p.perguntas.map(q => q.tema + ": " + q.texto), ...p.pedidos_adido.map(q => q.tema + ": " + q.texto), ...p.ja_pedido, p.agroinsight || "", p.alerta || ""];
  p.secoes.forEach(s => s.itens.forEach(it => {
    if (it.paras) t.push(ptxt(it.paras)); if (it.t === "kpi") t.push(it.rotulo + " " + it.valor + " " + it.unidade + " " + ptxt(it.linhas));
    if (it.t === "tab") t.push(it.linhas.map(l => l.join(" ")).join(" · "));
  }));
  return t.filter(Boolean);
}
const IDX = D.paises.map(p => ({iso: p.iso, partes: textoPais(p)}));
function busca(q) {
  const nq = norm(q.trim()); if (nq.length < 2) return "";
  const nomes = D.paises.filter(p => norm(p.pais + " " + (SINON[p.iso] || "")).includes(nq));
  let h = "";
  if (nomes.length) h += nomes.map(p => `<a class="res" href="#/p/${p.iso}"><span class="n">${flag(p.iso)} ${esc(p.pais)}</span> <span class="s">${esc(p.dia)} ${esc(p.hora)}</span></a>`).join("");
  const outros = IDX.filter(x => !nomes.find(p => p.iso === x.iso)).map(x => ({iso: x.iso, hits: x.partes.filter(s => norm(s).includes(nq))})).filter(x => x.hits.length);
  if (outros.length) h += `<div class="dia">O termo aparece em ${outros.length} ${outros.length > 1 ? "países" : "país"}</div>` + outros.map(x => {
    const s = x.hits[0], k = norm(s).indexOf(nq), a = Math.max(0, k - 70);
    const tr = (a ? "…" : "") + esc(s.slice(a, k)) + "<mark>" + esc(s.slice(k, k + q.trim().length)) + "</mark>" + esc(s.slice(k + q.trim().length, k + 120)) + "…";
    return `<a class="res" href="#/p/${x.iso}?q=${encodeURIComponent(q.trim())}"><span class="n">${flag(x.iso)} ${esc(P[x.iso].pais)}</span> <span class="s">(${x.hits.length} trecho${x.hits.length > 1 ? "s" : ""})</span><div class="s">${tr}</div></a>`;
  }).join("");
  return h || `<div class="vazio">Nada encontrado para “${esc(q)}”.</div>`;
}
function realca(raiz, termo) {
  const nq = norm(termo); if (nq.length < 2) return;
  raiz.querySelectorAll("details").forEach(d => { if (norm(d.textContent).includes(nq)) d.open = true; });
  const w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT), nos = [];
  while (w.nextNode()) nos.push(w.currentNode);
  nos.forEach(n => {
    const t = n.nodeValue, base = Array.from(t).map(c => norm(c)[0] || c).join("");
    const k = base.indexOf(nq); if (k < 0 || base.length !== t.length) return;
    const m = document.createElement("mark"); const r = document.createRange(); r.setStart(n, k); r.setEnd(n, k + nq.length); r.surroundContents(m);
  });
  const f = raiz.querySelector("mark"); if (f) f.scrollIntoView({block: "center"});
}

// ---------------- roteamento
function render() {
  const app = document.getElementById("app"), q = document.getElementById("q").value;
  const [rota, qs] = location.hash.slice(1).split("?");
  document.getElementById("nv-pan").classList.toggle("on", !rota || rota === "/");
  document.getElementById("nv-cmp").classList.toggle("on", rota.startsWith("/comparar"));
  if (q.trim().length >= 2 && !rota.startsWith("/p/")) { app.innerHTML = busca(q); return; }
  if (rota.startsWith("/comparar")) {
    const sel = new URLSearchParams(qs || "").get("sel");
    if (sel) { SEL.length = 0; sel.split(",").map(s => s.trim().toUpperCase()).filter(s => P[s]).slice(0, 4).forEach(s => SEL.push(s)); }
    app.innerHTML = comparar(rota.split("/")[2]); return;
  }
  if (rota.startsWith("/p/")) {
    const termo = new URLSearchParams(qs || "").get("q") || "";
    app.innerHTML = paginaPais(rota.slice(3), termo);
    if (new URLSearchParams(qs || "").get("abrir")) app.querySelectorAll("details").forEach(d => d.open = true);
    if (termo) realca(app, termo); else window.scrollTo(0, 0);
    return;
  }
  app.innerHTML = panorama();
}
document.getElementById("app").addEventListener("click", e => {
  const s = e.target.closest("[data-sel]");
  if (s) { const i = SEL.indexOf(s.dataset.sel); if (i >= 0) SEL.splice(i, 1); else { if (SEL.length >= 4) SEL.shift(); SEL.push(s.dataset.sel); } render(); return; }
  const o = e.target.closest("[data-ord]");
  if (o) { const c = +o.dataset.ord; if (ORD.tab === o.dataset.tab && ORD.col === c) ORD.asc = !ORD.asc; else { ORD.tab = o.dataset.tab; ORD.col = c; ORD.asc = c === 0; } render(); return; }
  const b = e.target.closest(".chip[data-f]"); if (!b) return;
  const k = b.dataset.f, v = b.dataset.v;
  F[k] = k === "alerta" ? !F.alerta : (F[k] === v ? "" : v);
  render();
});
document.getElementById("q").addEventListener("input", () => { if (location.hash.startsWith("#/p/")) location.hash = "#/"; else render(); });
window.addEventListener("hashchange", render);
render();
</script>
